<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARMath 2.0 · Duas propostas de interface</title>
<style>
:root{color-scheme:dark;--bg:#141817;--surface:#1c2220;--panel:#222a27;--border:#39443f;--text:#f0f5f1;--muted:#b3c0b8;--accent:#64f58b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px "Segoe UI",system-ui,sans-serif}
body.light{color-scheme:light;--bg:#eef2ef;--surface:#fafcf9;--panel:#f0f5f0;--border:#c9d6cc;--text:#17271d;--muted:#43584b;--accent:#086d30}
button,select,input{font:inherit;accent-color:var(--accent)}button,select{color:var(--text);background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:8px 12px}button{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.review,.window{width:min(1220px,calc(100% - 32px));margin:16px auto}.review,.top,.statusbar,.toolbar,.row,.segmented{display:flex;align-items:center;gap:10px}.review{justify-content:space-between;flex-wrap:wrap}.segmented{flex-wrap:wrap}.segmented button[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}
.window{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden}.top,.statusbar{justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border)}.brand{color:var(--accent);font-size:20px;font-weight:750;letter-spacing:-.03em}.top .row{gap:16px}
.workspace{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,340px);gap:14px;align-items:start;padding:14px}.workspace[data-layout=foco]{grid-template-columns:minmax(0,1fr)}.workspace[data-layout=foco] .side{grid-template-columns:1fr 1fr}.side{display:grid;gap:10px}.panel,.camera{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px}h2{margin:0 0 10px;font-size:15px}.stage{position:relative;background:var(--bg);display:grid;place-items:center;aspect-ratio:4/3;border-radius:8px;overflow:hidden}.workspace[data-layout=foco] .stage{aspect-ratio:16/9;max-height:60vh}.stage img{position:absolute;width:100%;height:100%;object-fit:contain}.stage[data-state]:not([data-state=live]) img{display:none}.stage[data-state=scan] img{display:block;filter:blur(7px) brightness(.23)}
.message{z-index:1;text-align:center;padding:22px}.message strong{display:block;font-size:19px}.message p{margin:8px 0 0;color:var(--muted)}.status{color:var(--accent);font-size:13px}.status.error{color:#e46a68}.camera-heading{display:flex;justify-content:space-between;gap:12px}.equation{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 2px 2px}.equation span{font:20px Cambria,serif}.toolbar{margin-top:10px;flex-wrap:wrap}.switch{display:flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}.switch input{appearance:none;background:var(--border);border-radius:14px;width:33px;height:18px;position:relative;margin:0}.switch input:before{content:'';position:absolute;left:3px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--text)}.switch input:checked{background:var(--accent)}.switch input:checked:before{left:18px;background:var(--bg)}
.ranges .row{display:grid;grid-template-columns:74px 1fr 46px 32px;margin:9px 0;gap:5px}.ranges input{width:100%;min-width:0}.ranges output{text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}.reset{padding:3px 5px;color:var(--accent)}fieldset{border:0;padding:0;margin:12px 0 0;display:grid;gap:9px}fieldset:disabled{opacity:.48}.choices{display:flex;justify-content:space-between;gap:8px}.choices label{white-space:nowrap}.statusbar{border-bottom:0;border-top:1px solid var(--border);color:var(--muted);font-size:13px}small{color:var(--muted)}[hidden]{display:none!important}
@media(max-width:740px){.workspace,.workspace[data-layout=foco] .side{grid-template-columns:1fr}.equation{flex-wrap:wrap}}
</style>
</head>
<body>
<header class="review">
<nav class="segmented" aria-label="Comparar propostas">
<button data-layout="foco" aria-pressed="true">1. Câmera em destaque</button>
<button data-layout="painel" aria-pressed="false">2. Painel de exploração</button>
</nav>
<label>Estado da câmera <select id="state"><option value="live">Superfície detectada</option><option value="connecting">Conectando</option><option value="scan">Aguardando marcador</option><option value="error">Indisponível</option></select></label>
</header>
<div class="window">
<header class="top"><span class="brand">ARMath 2.0</span><div class="row"><label class="switch"><input type="checkbox" id="theme" role="switch"><span>Modo claro</span></label></div></header>
<main class="workspace" data-layout="foco">
<section class="camera">
<div class="camera-heading"><h2>Câmera</h2><span class="status">● Ao vivo</span></div>
<div class="stage" data-state="live"><img id="surface" alt="Prévia de uma superfície matemática sobre um marcador ArUco"><div class="message" hidden><strong></strong><p></p></div></div>
<div class="equation"><strong>Elipsoide</strong><span>x²/0,9² + y²/0,7² + z²/0,5² = 1</span></div>
<div id="quick"></div>
</section>
<aside class="side">
<section class="panel" id="visual"><h2>Visualização</h2><div class="toolbar" id="toggles"><label class="switch"><input type="checkbox" id="axes" role="switch">Eixos 3D</label><label class="switch"><input type="checkbox" id="box" role="switch" checked>Caixa</label><label class="switch"><input type="checkbox" id="grid" role="switch">Grade</label></div></section>
<section class="panel"><h2>Transformação</h2><div class="ranges" id="ranges"></div><button id="resetAll">Redefinir</button></section>
<section class="panel"><h2>Plano de corte</h2><label class="switch"><input type="checkbox" id="plane" role="switch">Mostrar plano</label><fieldset id="plane-controls" aria-label="Controles do plano de corte" disabled><div class="choices"><label><input type="radio" name="plane" checked> XY</label><label><input type="radio" name="plane"> XZ</label><label><input type="radio" name="plane"> YZ</label></div><label>Deslocamento <input type="range" min="-100" max="100" value="0" id="offset"> <output id="offset-value">0%</output></label></fieldset></section>
</aside>
</main>
<footer class="statusbar"><span>Protótipo · câmera simulada</span><span id="hint">Controles de visualização junto à prévia</span></footer>
</div>

const states={
 live:['Ao vivo','',''],
 connecting:['Conectando','Conectando à câmera','Aguarde a imagem da webcam.'],
 scan:['Ao vivo','Aponte para um marcador','Mantenha os quatro cantos visíveis dentro da câmera.'],

const controls=$('#toggles');
for(const button of document.querySelectorAll('button[data-layout]'))button.onclick=()=>{
 const focus=button.dataset.layout==='foco';
 for(const other of document.querySelectorAll('button[data-layout]'))other.setAttribute('aria-pressed',other===button);
 $('.workspace').dataset.layout=button.dataset.layout;
 $('#visual').hidden=focus;
 (focus?$('#quick'):$('#visual')).append(controls);
 $('#hint').textContent=focus?'Controles de visualização junto à prévia':'Controles agrupados na coluna lateral';
};
$('button[data-layout=foco]').click();
function update(){
 const state=$('#state').value,[status,title,description]=states[state];
 const live=state==='live',cut=$('#plane').checked,axes=$('#axes').checked;
 $('.stage').dataset.state=state;
 $('.status').textContent='● '+status;
 $('.status').classList.toggle('error',state==='error');
 $('.message').hidden=live;
 $('.message strong').textContent=title;
 $('.message p').textContent=description;
 $('#plane-controls').disabled=!cut;
 const example=cut?'cut':axes?'axes':'elipsoid';
