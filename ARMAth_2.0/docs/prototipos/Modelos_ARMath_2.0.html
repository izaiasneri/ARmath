<aside class="side"><section class="panel" id="visual"><h2>Visualização</h2><div class="switches" id="switches"><label><input type="checkbox" id="axis"> Eixos 3D</label><label><input type="checkbox" id="box"> Caixa</label></div></section><section class="panel"><h2>Transformação</h2><div id="sliders"></div><button id="resetAll">Redefinir</button></section><section class="panel plane"><h2>Plano de corte</h2><label><input type="checkbox" id="plane"> Mostrar plano</label><div id="cut" hidden><p><select aria-label="Orientação do plano"><option>XY</option><option>XZ</option><option>YZ</option></select></p><label>Deslocamento <input type="range" style="appearance:auto;width:auto" aria-label="Deslocamento" min="-100" max="100" value="0"></label></div></section></aside></main><footer class="foot"><span class="photo">Prévia de interface</span><span>Controles ilustrativos</span></footer></div>
<script>
const $=s=>document.querySelector(s);
const switches=$('#switches'), visual=$('#visual');
for(const button of document.querySelectorAll('button[data-model]'))button.onclick=()=>{
 const model=button.dataset.model;
 for(const b of document.querySelectorAll('button[data-model]'))b.setAttribute('aria-pressed',b===button);
 $('.workspace').dataset.model=model;
 visual.hidden=model!=='lateral';
 (model==='lateral'?visual:$(model==='abaixo'?'#bottomControls':'#headControls')).append(switches);
};
const states={
 demo:['Ao vivo','',''],
 conectando:['Conectando','Conectando à câmera','Aguarde a imagem da webcam.'],
 marcador:['Ao vivo','Aponte para um marcador ArUco','Deixe os quatro cantos e a margem branca visíveis.'],
 erro:['Indisponível','Câmera indisponível','Confira a conexão e a permissão de acesso à webcam.']
};
function update(){
 const state=$('#state').value,[status,title,desc]=states[state], live=state==='demo';
 $('.screen').dataset.state=state;
 $('.status').dataset.state=state; $('.status').textContent='• '+status;
 $('.message').hidden=live; $('.message strong').textContent=title; $('.message p').textContent=desc;
 $('.equation strong').textContent=live?'Ondas senoidais':'Superfície';
 $('.equation span').textContent=live?'z = sin(2x) cos(2y)':'—';
 $('.outline').hidden=!live||!$('#box').checked; $('.axes').hidden=!live||!$('#axis').checked;
}
for(const id of ['#state','#box','#axis'])$(id).onchange=update;
$('#plane').onchange=()=>$('#cut').hidden=!$('#plane').checked;
const resets=[];
for(const [name,min,max,step,initial,suffix] of [['Escala',1,3,.01,1.77,'×'],['Rotação X',-180,180,1,0,'°'],['Rotação Y',-180,180,1,0,'°'],['Rotação Z',-180,180,1,97,'°']]){
 const id='range'+resets.length,row=document.createElement('div');row.className='row';
 row.innerHTML='<label for="'+id+'">'+name+'</label><input id="'+id+'" type="range" min="'+min+'" max="'+max+'" step="'+step+'" value="'+initial+'"><output></output><button class="reset" aria-label="Redefinir '+name+'">↻</button>';
 const input=row.querySelector('input'), output=row.querySelector('output');
 input.oninput=()=>output.textContent=Number(input.value).toLocaleString('pt-BR')+suffix;
 const reset=()=>{input.value=suffix==='×'?1:0;input.oninput()};
 resets.push(reset);row.querySelector('button').onclick=reset;input.oninput();$('#sliders').append(row);
}
$('#resetAll').onclick=()=>resets.forEach(reset=>reset());
</script></body></html>
